    <title>Lavoro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #081020;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            padding-top: max(2rem, env(safe-area-inset-top));
            padding-bottom: max(2rem, env(safe-area-inset-bottom));
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #0f1f35;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            overflow: hidden;
        }

        .logo img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.9375rem;
            line-height: 1.5;
            max-width: 320px;
            margin-bottom: 2rem;
        }

        button {
            width: 100%;
            max-width: 320px;
            padding: 0.875rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            -webkit-appearance: none;
        }

        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.6; }
    </style>

    <h1>Lavoro is niet bereikbaar</h1>
    <p>Controleer je internetverbinding. Zodra er weer verbinding is, gaat de app vanzelf verder.</p>

    <button id="retry" type="button">Opnieuw proberen</button>

    <script>
        /**
         * Shown by the app (LavoroWebViewClient) when the server cannot be
         * reached. This page has no Capacitor bridge and does not know the
         * server's address: it goes to /opnieuw-verbinden, which the app
         * intercepts to load the server it was built with.
         */
        function retry() {
            document.getElementById('retry').disabled = true;
            window.location.replace('/opnieuw-verbinden');
        }

        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
    </script>
