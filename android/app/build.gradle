apply plugin: 'com.android.application'

def server_url = (project.findProperty('lavoroServerUrl') ?: 'https://app.lavorofsm.nl').toString().replaceAll('/+$', '')
def server_uri = new URI(server_url)

/**
 * Push needs a Firebase project, and that comes as google-services.json. The
 * app is told whether it was there, because registering for push without it
 * crashes the app natively. The file is committed: it is client configuration
 * that every APK carries anyway. A debug build may go without it; a release
 * build may not, or it would ship an app that never receives a notification.
 */
def google_services = file('google-services.json')
def push_available = google_services.exists() && !google_services.text.trim().isEmpty()

def keystore_properties = new Properties()
def keystore_file = rootProject.file('keystore.properties')
if (keystore_file.exists()) {
    keystore_file.withInputStream { keystore_properties.load(it) }
}

android {
    namespace = "nl.lavoro.fsm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "nl.lavoro.fsm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SERVER_URL", "\"${server_url}\""
        buildConfigField "boolean", "PUSH_AVAILABLE", push_available ? "true" : "false"
        manifestPlaceholders = [
            appLinkHost: server_uri.host,
            usesCleartextTraffic: server_uri.scheme == 'http' ? 'true' : 'false',
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (keystore_file.exists()) {
                storeFile rootProject.file(keystore_properties['storeFile'])
                storePassword keystore_properties['storePassword']
                keyAlias keystore_properties['keyAlias']
                keyPassword keystore_properties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystore_file.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def building_release = graph.allTasks.any { it.name ==~ /(bundle|assemble|package)Release/ }
    if (building_release && server_uri.scheme != 'https') {
        throw new GradleException("A release build must load an https server, not ${server_url}")
    }
    if (building_release && !keystore_file.exists()) {
        throw new GradleException('A release build needs android/keystore.properties with the upload key; see docs/install/android.md')
    }
    if (building_release && !push_available) {
        throw new GradleException('A release build needs android/app/google-services.json, or the app gets no push; see docs/install/android.md')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-location:21.3.0"

    /**
     * LavoroMessagingService extends the push plugin's service, which keeps
     * Firebase to itself; the shared version keeps the two the same.
     */
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (push_available) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
